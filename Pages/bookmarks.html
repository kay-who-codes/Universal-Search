.page-header h1 {

.page-header p {

    margin-top: 4px;
}
 
.bookmarks-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
    flex-wrap: wrap;
}
 
.bookmarks-search {
    flex: 1;
    min-width: 200px;
}
 
.bookmarks-search input {
    width: 100%;
    padding: 11px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background-color: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
}
 
.bookmarks-search input:focus {
    border-color: var(--accent);
}
 
.bookmarks-search input::placeholder {
    color: var(--text-faint);
}
 
.bookmarks-toolbar-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
}
 
.density-btn,
.page-toggle-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space: nowrap;
}
 
.density-btn:hover,
.page-toggle-btn:hover {
    color: var(--text);
    border-color: var(--accent);
}
 
.density-btn.active,
.page-toggle-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
}
 
.page-toggle-wrapper {
    position: relative;
    display: inline-flex;
}
 
.page-toggle-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 150px;
    z-index: 20;
    box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.35);
}
 
.page-toggle-menu.hidden {
    display: none;
}
 
.page-toggle-option {
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, color 0.15s;
}
 
.page-toggle-option:hover {
    background: var(--accent-soft);
    color: var(--text);
}
 
.page-toggle-option.active {
    color: var(--accent);
}
 
.bookmarks-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    transition: gap 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
 
.bookmarks-container.dense {
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
}
 
.bookmarks-container.dense .bookmark-category {
    padding: 14px 16px;
    border-radius: 8px;
}
 
.bookmarks-container.dense .category-header {
    font-size: 0.68rem;
    margin-bottom: 8px;
    padding-bottom: 8px;
}
 
.bookmarks-container.dense .bookmark-list {
    gap: 1px;
}
 
.bookmarks-container.dense .bookmark-item {
    font-size: 0.82rem;
    padding: 3px 0;
}
 
.bookmarks-container.dense .show-more-btn {
    font-size: 0.68rem;
    margin-top: 6px;
}
 
/* Smooth transitions for density change */
.bookmark-category {
    background-color: var(--cat-bg, var(--surface));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: padding 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                border-radius 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease,
                background-color 0.25s ease;
}
 
.bookmark-category::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--cat-color, var(--accent));
    opacity: 0.7;
}
 
.bookmark-category:hover {
    border-color: var(--cat-color, var(--accent));
    box-shadow: 0 0 24px -6px var(--cat-glow, transparent);
    transform: translateY(-2px);
}
 
.bookmark-category.hidden {
    display: none;
}
 
.category-header {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    color: var(--cat-color, var(--text));
    transition: font-size 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                margin-bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                padding-bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    text-shadow: 0 0 12px var(--cat-glow, transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}
 
.category-header .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}
 
.category-icon {
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    background-color: var(--cat-color, var(--accent));
    -webkit-mask-image: var(--icon-url);
    mask-image: var(--icon-url);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
 
.bookmarks-container.dense .category-icon {
    width: 13px;
    height: 13px;
}
 
.category-header .page-tag {
    font-size: 0.62em;
    opacity: 0.6;
    letter-spacing: 0.04em;
    text-transform: none;
    font-weight: 400;
}
 
.bookmark-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    transition: gap 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
 
.bookmark-item {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0;
    transition: color 0.15s, transform 0.15s, text-shadow 0.15s,
                font-size 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: block;
}
 
.bookmark-item:hover {
    color: var(--cat-color, var(--accent2));
    transform: translateX(3px);
    text-shadow: 0 0 8px var(--cat-glow, transparent);
}
 
.bookmark-item.hidden {
    display: none;
}
 
.bookmark-item.overflow-item {
    display: none;
}
 
.bookmark-item.overflow-item.expanded {
    display: block;
}
 
.show-more-btn {
    background: none;
    border: none;
    color: var(--cat-color, var(--accent));
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 0 0 0;
    text-align: left;
    opacity: 0.85;
    transition: opacity 0.15s;
}
 
.show-more-btn:hover {
    opacity: 1;
    text-decoration: underline;
}
 
.show-more-btn.hidden {
    display: none;
}
 
.no-results {
    text-align: center;
    color: var(--text-faint);
    padding: 48px 20px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    display: none;
}
 
.no-results.show {
    display: block;
    animation: fadeIn 0.3s ease;
}
 
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
 
/* Entrance animation for category cards */
.bookmark-category {
    animation: cardIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
}
 
@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
 
@media (max-width: 600px) {
    .bookmarks-container {
        grid-template-columns: 1fr;
    }

    .page-toggle-menu {
        left: 0;
        right: auto;
    }
}

    const PAGE_DATA = {
        primary: bookmarksPrimary,
        secondary: bookmarksSecondary
    };
    // Extend the (redacted) PAGE_DATA object with the new tertiary page without touching its original contents.
    PAGE_DATA.tertiary = bookmarksTertiary;
 
    const PAGE_LABELS = {
        primary: { title: 'Bookmarks', subtitle: '', toggleShows: '🥇' },
        secondary: { title: 'Secondary Bookmarks', subtitle: '', toggleShows: '🥈' }
    };
    // Extend the (redacted) PAGE_LABELS object with the new tertiary page without touching its original contents.
    PAGE_LABELS.tertiary = {
        title: "Tertiary Bookmarks",
        subtitle: "Quick access to your favorite sites.",
        toggleShows: "🥉"
    };

    // Single source of truth for page emoji, used by both the toggle menu
    // and the per-result page tags shown in search results.
    const PAGE_EMOJI = { primary: '🥇', secondary: '🥈', tertiary: '🥉' };
    function emojiForPage(page) {
        return PAGE_EMOJI[page] || '🥉';
    }
 
    const VISIBLE_LIMIT = 8;
 
    // Unique color per category (hue-based, used for accent + glow)
    const categoryColors = {
        "Entertainment":       "#ff5c8a",
        "Prudence":            "#4dd0e1",
        "Communication":       "#5c9dff",
        "Cloud Storage":       "#8a7dff",
        "Programming":         "#38d9a9",
        "Reading":             "#ffb84d",
        "Words":               "#ff8fab",
        "Money":               "#5cd65c",
        "Social":              "#4da6ff",
        "Gaming":              "#c084fc",
        "AI Chat":             "#ff9f43",
        "Profiteering":        "#129900",
        "Shopping":            "#ff6b6b",
        "UK Legal Resources":  "#748ffc",
        "Creative":            "#f783ac",
        "Language Learning":   "#63e6be",
        "Travel":              "#FF55D4"
    };

        // Category name -> icon (raw SVG from GitHub, recoloured per-category via CSS mask).
    // Icons are plain white/monochrome outline SVGs; since we mask instead of
    // filtering, their original fill colour doesn't matter.
    const ICON_BASE = 'https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/';
    const categoryIcons = {
        'Creative': 'palette.svg',
        'Social': 'users.svg',
        'Prudence': 'check-check.svg',
        'Money': 'chart-spline.svg',
        'Shopping': 'shopping-cart.svg',
        'Entertainment': 'clapperboard.svg',
        'Reading': 'book-open.svg',
        'UK Legal Resources': 'graduation-cap.svg',
        'AI Chat': 'sparkle.svg',
        'Cloud Storage': 'cloud.svg',
        'Language Learning': 'file-text.svg',
        'Gaming': 'gamepad-2.svg',
        'Travel': 'plane.svg',
        'Communication': 'speech.svg',
        'Words': 'type.svg',
        'Profiteering': 'dollar-sign.svg',
        'Programming': 'code.svg',
    };
    const DEFAULT_ICON = 'bookmark.svg';
 
    function iconUrlForCategory(category) {
        const file = categoryIcons[category] || DEFAULT_ICON;
        return `url("${ICON_BASE}${file}")`;
    }
 
    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
 
    const bookmarksContainer = document.getElementById('bookmarks-container');
    const bookmarksSearchInput = document.getElementById('bookmarks-search-input');
    const noResults = document.getElementById('no-results');
    const pageToggle = document.getElementById('page-toggle');
    const pageToggleMenu = document.getElementById('page-toggle-menu');
    const pageToggleLabel = document.getElementById('page-toggle-label');
    const pageTitleEl = document.getElementById('bookmarks-page-title');
    const pageSubtitleEl = document.getElementById('bookmarks-page-subtitle');
 
    let currentPage = 'primary';
    let searchActive = false;
 
    function groupByCategory(items) {
        const grouped = {};
        items.forEach(bookmark => {
            if (!grouped[bookmark.category]) grouped[bookmark.category] = [];
            grouped[bookmark.category].push(bookmark);
        });
        return grouped;
    }
 
    function buildCategoryCard(category, items, index, showPageTag) {
        const color = categoryColors[category] || "var(--accent)";
 
        const categoryCard = document.createElement('div');
        categoryCard.className = 'bookmark-category';
        categoryCard.dataset.category = category;
        categoryCard.style.setProperty('--cat-color', color);
        categoryCard.style.setProperty('--cat-glow', hexToRgba(color, 0.35));
        categoryCard.style.setProperty('--cat-bg', hexToRgba(color, 0.07));
        categoryCard.style.animationDelay = `${index * 30}ms`;
 
        const categoryHeader = document.createElement('div');
        categoryHeader.className = 'category-header';
 
        const headerLeft = document.createElement('div');
        headerLeft.className = 'header-left';
 
        const categoryIcon = document.createElement('span');
        categoryIcon.className = 'category-icon';
        categoryIcon.style.setProperty('--icon-url', iconUrlForCategory(category));
        headerLeft.appendChild(categoryIcon);
 
        const headerText = document.createElement('span');
        headerText.textContent = category;
        headerLeft.appendChild(headerText);
 
        categoryHeader.appendChild(headerLeft);
 
        const bookmarkList = document.createElement('div');
        bookmarkList.className = 'bookmark-list';
 
        items.forEach((bookmark, i) => {
            const bookmarkLink = document.createElement('a');
            bookmarkLink.href = bookmark.url;
            bookmarkLink.className = 'bookmark-item';
            if (i >= VISIBLE_LIMIT) {
                bookmarkLink.classList.add('overflow-item');
            }
            bookmarkLink.target = '_blank';
            bookmarkLink.textContent = bookmark.name;
            bookmarkLink.dataset.name = bookmark.name.toLowerCase();
            bookmarkLink.dataset.tags = bookmark.tags.join(' ').toLowerCase();
            if (showPageTag && bookmark.__page) {
                bookmarkLink.dataset.page = bookmark.__page;
                const tag = document.createElement('span');
                tag.className = 'page-tag';
                const pageEmoji = emojiForPage(bookmark.__page);
                tag.textContent = ` (${pageEmoji})`;
                bookmarkLink.appendChild(tag);
            }
            bookmarkList.appendChild(bookmarkLink);
        });
 
        categoryCard.appendChild(categoryHeader);
        categoryCard.appendChild(bookmarkList);
 
        if (items.length > VISIBLE_LIMIT) {
            const moreBtn = document.createElement('button');
            moreBtn.className = 'show-more-btn';
            const remaining = items.length - VISIBLE_LIMIT;
            moreBtn.textContent = `+ ${remaining} more`;
            moreBtn.dataset.expanded = 'false';
            moreBtn.addEventListener('click', () => {
                const expanded = moreBtn.dataset.expanded === 'true';
                const overflowItems = bookmarkList.querySelectorAll('.overflow-item');
                overflowItems.forEach(item => item.classList.toggle('expanded', !expanded));
                moreBtn.dataset.expanded = (!expanded).toString();
                moreBtn.textContent = expanded ? `+ ${remaining} more` : 'Show less';
            });
            categoryCard.appendChild(moreBtn);
        }
 
        return categoryCard;
    }
 
    function renderBookmarks() {
        bookmarksContainer.innerHTML = '';
        const items = PAGE_DATA[currentPage];
        const grouped = groupByCategory(items);
 
        Object.keys(grouped).forEach((category, index) => {
            const card = buildCategoryCard(category, grouped[category], index, false);
            bookmarksContainer.appendChild(card);
        });
 
        noResults.classList.remove('show');
        searchActive = false;
    }
 
    function renderSearchResults(term) {
        bookmarksContainer.innerHTML = '';

        const combined = Object.keys(PAGE_DATA).flatMap(page =>
            PAGE_DATA[page].map(b => ({ ...b, __page: page }))
        );

        const matched = combined.filter(b =>
            b.name.toLowerCase().includes(term) ||
            b.category.toLowerCase().includes(term) ||
            b.url.toLowerCase().includes(term) ||
            b.tags.join(' ').toLowerCase().includes(term)
        );

        if (matched.length === 0) {
            noResults.classList.add('show');
            return;
        }
        noResults.classList.remove('show');

        const grouped = groupByCategory(matched);
        Object.keys(grouped).forEach((category, index) => {
            const card = buildCategoryCard(category, grouped[category], index, true);
            bookmarksContainer.appendChild(card);
        });

        searchActive = true;
    }
 
    function handleSearchInput(value) {
        const term = value.toLowerCase().trim();
        if (term === '') {
            renderBookmarks();
            return;
        }
        renderSearchResults(term);
    }

    function debounce(fn, delay) {
        let t;
        return (...args) => {
            clearTimeout(t);
            t = setTimeout(() => fn(...args), delay);
        };
    }
    const debouncedSearch = debounce(handleSearchInput, 750);
 
    function updateToggleMenuActiveState() {
        const options = pageToggleMenu.querySelectorAll('.page-toggle-option');
        options.forEach(opt => {
            opt.classList.toggle('active', opt.dataset.page === currentPage);
        });
    }

    // Builds the toggle-menu buttons from PAGE_DATA so a future page needs
    // no menu-markup changes — just an entry in PAGE_DATA/PAGE_LABELS.
    function buildToggleMenu() {
        pageToggleMenu.innerHTML = '';
        Object.keys(PAGE_DATA).forEach(page => {
            const btn = document.createElement('button');
            btn.className = 'page-toggle-option';
            btn.dataset.page = page;
            const label = (PAGE_LABELS[page] && PAGE_LABELS[page].title) || page;
            btn.textContent = `${emojiForPage(page)} ${label}`;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                setPage(page);
                closeToggleMenu();
            });
            pageToggleMenu.appendChild(btn);
        });
    }
 
    function closeToggleMenu() {
        pageToggleMenu.classList.add('hidden');
    }
 
    function setPage(page) {
        currentPage = page;
        const labels = PAGE_LABELS[page];
        pageTitleEl.textContent = labels.title;
        pageSubtitleEl.textContent = labels.subtitle;
        pageToggleLabel.textContent = labels.toggleShows;
        updateToggleMenuActiveState();
 
        // Re-apply current search (if any), otherwise render the page normally
        const term = bookmarksSearchInput.value.toLowerCase().trim();
        if (term === '') {
            renderBookmarks();
        } else {
            renderSearchResults(term);
        }
    }
 
    function init() {
        renderBookmarks();
        buildToggleMenu();
        updateToggleMenuActiveState();

    bookmarksSearchInput.addEventListener('input', (e) => {
        debouncedSearch(e.target.value);
    });

    bookmarksSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const term = bookmarksSearchInput.value.trim();
            if (term !== '') {
                window.open(`https://search.brave.com/search?q=${encodeURIComponent(term)}`, '_blank');
            }
        }
    });

    pageToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const willOpen = pageToggleMenu.classList.contains('hidden');
        pageToggleMenu.classList.toggle('hidden');
        if (willOpen) {
            // Reset to default (right-aligned) positioning, then clamp to viewport if it overflows.
            pageToggleMenu.style.left = '';
            pageToggleMenu.style.right = '';
            const rect = pageToggleMenu.getBoundingClientRect();
            if (rect.left < 0) {
                pageToggleMenu.style.left = '0';
                pageToggleMenu.style.right = 'auto';
            } else if (rect.right > window.innerWidth) {
                pageToggleMenu.style.right = '0';
                pageToggleMenu.style.left = 'auto';
            }
        }
    });

    document.addEventListener('click', (e) => {
        if (!pageToggleMenu.classList.contains('hidden') && !pageToggleMenu.contains(e.target) && e.target !== pageToggle) {
            closeToggleMenu();
        }
    });
 
        const densityToggle = document.getElementById('density-toggle');
        const densityLabel = document.getElementById('density-label');
 
        if (localStorage.getItem('bookmarksDense') === 'true') {
            bookmarksContainer.classList.add('dense');
            densityToggle.classList.add('active');
            densityLabel.textContent = 'Comfortable';
            densityToggle.querySelector('i').className = 'fas fa-th-large';
        }
 
        densityToggle.addEventListener('click', function () {
            const isDense = bookmarksContainer.classList.toggle('dense');
            this.classList.toggle('active', isDense);
            densityLabel.textContent = isDense ? 'Comfortable' : 'Compact';
            this.querySelector('i').className = isDense ? 'fas fa-th-large' : 'fas fa-grip-lines';
            localStorage.setItem('bookmarksDense', isDense);
        });
    }
 
    init();
 
    // Register this page's focus handler with the shell (generic hook, keyed by page id)
    window.__pageFocus = window.__pageFocus || {};
    window.__pageFocus.bookmarks = function () {
        setTimeout(() => bookmarksSearchInput.focus(), 50);
    };
 
})();
</script>
